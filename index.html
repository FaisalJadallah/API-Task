<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management</title>
    <link rel="stylesheet" href="style.css"> 
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
      rel="stylesheet"
    />
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-dark">
        <div class="container">
          <a class="navbar-brand" href="#"></a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link active text-white" aria-current="page" href="#">Fake Srore</a>
            </ul>
          </div>
        </div>
      </nav>
    <header>
        <h1>Fake Store API</h1>
        <button id="add-product-button" class="button">Add Product</button> 
    </header>

    <div id="add-product-form" class="form-container" style="display: none;">
        <h3>Add New Product</h3>
        <form id="product-form">
            <label for="title">Title:</label>
            <input type="text" id="title" required><br>
            <label for="price">Price:</label>
            <input type="number" id="price" required><br>
            <label for="description">Description:</label>
            <input type="text" id="description" required><br>
            <label for="image">Image URL:</label>
            <input type="url" id="image" required><br>
            <button type="submit" class="button">Add Product</button>
        </form>
    </div>

    <main id="product-container"></main>

    <footer>
        <p>&copy; 2025 Fake Store API</p>
    </footer>

    <script src="app.js"></script>
</body>

</html>
